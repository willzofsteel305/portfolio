<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact • Willz</title>
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>

<header class="navbar">
  <div class="nav-inner">
    <h1 class="logo">WILLZ</h1>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</header>

<section class="container contact-wrapper fade-up">
  <h2 class="section-title">Get in Touch</h2>
  <p class="section-subtitle">Let’s build something together.</p>

  <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent!');">
    
    <div class="contact-form-row">
      <div>
        <label>Name</label>
        <input type="text" required>
      </div>
      <div>
        <label>Email</label>
        <input type="email" required>
      </div>
    </div>

    <label>Message</label>
    <textarea required></textarea>

    <button class="btn btn-primary" type="submit">Send Message</button>
  </form>
</section>

<script src="scripts/scroll.js"></script>
  <script type="module" src="js/contact.js"></script>
</body>
</html>
